name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'k8s/**'
      - '.github/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        run: |
          # Use the short git commit SHA as the image tag for uniqueness
          TAG=$(echo ${GITHUB_SHA} | cut -c1-7)
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-app:$TAG .
          docker push ${{ secrets.DOCKER_USERNAME }}/my-app:$TAG
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Update Kubernetes Manifest
        run: |
          # This edits your deployment.yaml file to use the brand new image tag
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/my-app:${{ env.IMAGE_TAG }}|g" k8s/deployment.yaml
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "chore: update image to ${{ env.IMAGE_TAG }} [skip ci]"
          git push