name: Docker Multi-Container CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ----------------------------------------------------
  # STAGE 1: Build & Push Images (Runs on GitHub Cloud)
  # ----------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build and Push Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./blu-live-clinic/frontend
          file: ./blu-live-clinic/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-frontend:latest

      # 2. Build and Push Backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./blu-live-clinic/backend
          file: ./blu-live-clinic/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-backend:latest

      # 3. Build and Push DB
      - name: Build and Push DB
        uses: docker/build-push-action@v5
        with:
          context: ./blu-live-clinic/db
          file: ./blu-live-clinic/db/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-db:latest

  # ----------------------------------------------------
  # STAGE 2: Deploy Containers Locally (Runs on Self-Hosted Machine)
  # ----------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: self-hosted  # <--- Dispatches job directly to your running terminal
    steps:
      - name: Deploy Containers Locally
        run: |
          # Authenticate to Docker Hub locally
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

          # Pull fresh images
          docker pull ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-db:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-backend:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-frontend:latest

          # Ensure network exists
          docker network create clinic-network || true

          # --- Database Container ---
          docker stop clinic-db || true
          docker rm clinic-db || true
          docker run -d \
            --name clinic-db \
            --network clinic-network \
            --restart always \
            -v clinic_db_data:/var/lib/mysql \
            ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-db:latest

          # --- Backend Container ---
          docker stop clinic-backend || true
          docker rm clinic-backend || true
          docker run -d \
            --name clinic-backend \
            --network clinic-network \
            --restart always \
            -p 5000:5000 \
            ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-backend:latest

          # --- Frontend Container ---
          docker stop clinic-frontend || true
          docker rm clinic-frontend || true
          docker run -d \
            --name clinic-frontend \
            --network clinic-network \
            --restart always \
            -p 80:80 \
            ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-frontend:latest

          # Prune old dangling images
          docker image prune -f
