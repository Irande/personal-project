name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'manifests/**'
      - '.github/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        run: |
          # Use the short git commit SHA as the image tag for uniqueness
          TAG=$(echo ${GITHUB_SHA} | cut -c1-7)
          docker build -t ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-frontend:$TAG ./blu-live-clinic/frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-frontend:$TAG
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

          docker build -t ${{secrets.DOCKER_USERNAME }}/blu-live-clinic-backend:$TAG ./blu-live-clinic/backend
          docker push ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-backend:$TAG 
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

          docker build -t ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-db:$TAG ./blu-live-clinic/db
          docker push ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-db:$TAG
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Update Kubernetes Manifest
        run: |
          sed -i "s|image: .*frontend:.*|image: ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-frontend:${{ env.IMAGE_TAG }}|g" blu-live-clinic/manifests/frontend.yaml
          sed -i "s|image: .*backend:.*|image: ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-backend:${{ env.IMAGE_TAG }}|g" blu-live-clinic/manifests/backend.yaml
          sed -i "s|image: .*db:.*|image: ${{ secrets.DOCKER_USERNAME }}/blu-live-clinic-db:${{ env.IMAGE_TAG }}|g" blu-live-clinic/manifests/db.yaml
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add blu-live-clinic/manifests/*.yaml
          git commit -m "chore: update images to ${{ env.IMAGE_TAG }} [skip ci]"
          git push
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add blu-live-clinic/*
          git commit -m "chore: update image to ${{ env.IMAGE_TAG }} [skip ci]"
          git push
